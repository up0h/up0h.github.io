<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>UPOTSS WebRouter</title>

<meta name="description" content="UPOTSS WebRouter - Dynamic URL routing system.">

<meta property="og:type" content="website">
<meta property="og:title" content="UPOTSS WebRouter">
<meta property="og:description" content="Dynamic URL routing system.">
<meta property="og:url" content="https://oekcdn.github.io/">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="UPOTSS WebRouter">
<meta name="twitter:description" content="Dynamic URL routing system.">

<style>
body {
    background: #08090d;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.container {
    text-align: center;
    padding: 30px;
}

h2 {
    color: #ff6a00;
}

p {
    color: #aaa;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="container">
    <h2 id="title">UPOTSS WebRouter</h2>
    <p id="status">Loading route...</p>
</div>

<script>
(async () => {

    const params = new URLSearchParams(location.search);
    const route = params.keys().next().value;

    const titleElement = document.getElementById("title");
    const statusElement = document.getElementById("status");

    function setMeta(attribute, key, content) {
        let element = document.querySelector(
            `meta[${attribute}="${key}"]`
        );

        if (!element) {
            element = document.createElement("meta");
            element.setAttribute(attribute, key);
            document.head.appendChild(element);
        }

        element.setAttribute("content", content);
    }

    function updateMetadata(title, description) {
        document.title = title;
        titleElement.textContent = title;

        setMeta("name", "description", description);

        setMeta("property", "og:title", title);
        setMeta("property", "og:description", description);
        setMeta("property", "og:url", location.href);

        setMeta("name", "twitter:title", title);
        setMeta("name", "twitter:description", description);
    }

    if (!route) {
        updateMetadata(
            "UPOTSS WebRouter",
            "UPOTSS WebRouter - Dynamic URL routing system."
        );

        statusElement.textContent = "No route specified.";
        return;
    }

    updateMetadata(
        `Visit ${route} | UPOTSS WebRouter`,
        "Loading destination..."
    );

    try {

        // Load route.txt
        const response = await fetch(
            "/route.txt",
            { cache: "no-cache" }
        );

        if (!response.ok) {
            throw new Error("Failed to load route.txt");
        }

        const text = await response.text();

        // Parse routes
        const routes = {};

        text.split(/\r?\n/).forEach(line => {

            line = line.trim();

            if (!line || line.startsWith("#")) return;

            const separator = line.indexOf("=");

            if (separator < 1) return;

            const key = line.slice(0, separator).trim();
            const value = line.slice(separator + 1).trim();

            if (key && value) {
                routes[key] = value;
            }

        });

        // Find destination
        const destination = routes[route];

        if (!destination) {
            throw new Error("Route not found: " + route);
        }

        // Validate destination
        const url = new URL(destination);

        if (!["https:", "http:"].includes(url.protocol)) {
            throw new Error("Invalid URL protocol");
        }

        // Update metadata using FULL destination URL
        const title = `Visit ${route} | UPOTSS WebRouter`;

        const description = `Redirecting to ${url.href}`;

        updateMetadata(title, description);

        // Display destination
        statusElement.textContent = description;

        // Redirect
        location.replace(url.href);

    } catch (error) {

        statusElement.textContent =
            "Routing error: " + error.message;

    }

})();
</script>

</body>
</html>
